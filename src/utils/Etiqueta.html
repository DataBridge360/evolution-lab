<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Etiquetas</title>
<style>
  /* ===== Page setup: A4, sin márgenes (oculta encabezado/pie del navegador) ===== */
  @page {
    size: A4;
    margin: 0;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background:#eceae6;
    font-family: Arial, Helvetica, "Helvetica Neue", sans-serif;
    color:#111;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== A4 SHEET ===== */
  .sheet{
    width: 210mm;
    height: 297mm;
    background:#fff;
    margin: 24px auto;
    padding: 23.5mm 5mm; /* centra el grid 200x250 en 210x297 */
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 18px 40px -18px rgba(0,0,0,.25);

    display:grid;
    grid-template-columns: 100mm 100mm;
    grid-auto-rows: 50mm;
    gap: 0;
  }

  /* Guías de corte (líneas finas punteadas entre etiquetas) — solo visual */
  .sheet > .label{
    border: 0.25mm dashed #9aa0a6;
  }
  /* En pantalla: que las etiquetas internas tengan un borde de marco un poco más visible */
  /* (el marco real del componente se dibuja con .label-inner) */

  /* ===== LABEL (10cm × 5cm) ===== */
  .label{
    width: 100mm;
    height: 50mm;
    padding: 1.2mm;
    overflow:hidden;
  }
  .label-inner{
    width:100%;
    height:100%;
    border:0.35mm solid #111;
    display:flex;
    flex-direction:column;
    font-size: 6.5pt;
    line-height: 1.25;
  }

  .row{
    display:flex;
  }
  .row + .row{
    border-top:0.35mm solid #111;
  }

  /* Top: logo + empresa/fecha */
  .top{
    flex: 0 0 12.5mm;
  }
  .logo-cell{
    flex: 0 0 30mm;
    border-right:0.35mm solid #111;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 0.6mm 1.2mm;
  }
  .logo-cell img{
    max-width:100%;
    max-height: 11mm;
    display:block;
  }
  .top-fields{
    flex:1 1 auto;
    padding: 1.2mm 2mm;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap: 1.2mm;
    min-width:0;
  }

  .field{
    display:flex;
    align-items:baseline;
    gap: 1mm;
    min-width:0;
  }
  .field > .lbl{ flex:0 0 auto; }
  .underline{
    flex:1 1 auto;
    border-bottom:0.35mm solid #111;
    min-height: 1.3em;
    align-self:flex-end;
  }
  .ul-fixed{
    display:inline-block;
    border-bottom:0.35mm solid #111;
    width: 7mm;
    height: 0.9em;
    vertical-align:baseline;
    margin: 0 0.4mm;
  }
  .field.fecha{ flex:0 0 auto; }
  .field.fecha .slash{ padding: 0 0.2mm; }

  /* Tipo de Muestra */
  .tipo-row{ flex: 0 0 6.5mm; }
  .tipo{
    flex:1 1 auto;
    padding: 1.2mm 2mm;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap: 1mm 2.2mm;
  }
  .opt{
    display:inline-flex;
    align-items:center;
    gap: 0.8mm;
    white-space:nowrap;
  }
  .box{
    display:inline-block;
    width: 2mm;
    height: 2mm;
    border:0.35mm solid #111;
    background:#fff;
    flex:0 0 2mm;
  }

  /* Bottom: contacto + análisis */
  .bottom-row{ flex:1 1 auto; }
  .bottom{
    flex:1 1 auto;
    padding: 1.6mm 2mm;
    display:flex;
    flex-direction:column;
    justify-content: space-between;
    min-width:0;
  }
  .field-contact .underline{
    flex:1 1 auto;
    max-width: none;
  }
  .field-analisis{
    display:flex;
    align-items:baseline;
    gap: 1mm;
    min-width:0;
  }
  .field-analisis .lbl{ flex:0 0 auto; }
  .field-analisis .underline{ flex:1 1 auto; }
  .line{
    display:block;
    border-bottom:0.35mm solid #111;
    height: 1.3em;
  }

  /* ===== Toolbar (solo pantalla) ===== */
  .toolbar{
    position:fixed;
    top:14px;
    right:14px;
    display:flex;
    gap:8px;
    z-index:10;
    font-family: Arial, Helvetica, sans-serif;
  }
  .toolbar button{
    font: 500 13px/1 Arial, Helvetica, sans-serif;
    padding: 9px 14px;
    background:#111;
    color:#fff;
    border:none;
    border-radius:6px;
    cursor:pointer;
  }
  .toolbar button.ghost{
    background:#fff;
    color:#111;
    border:1px solid #111;
  }
  .toolbar button:hover{ opacity:.9; }
  .hint{
    position:fixed;
    left:14px;
    bottom:14px;
    background:#fff;
    border:1px solid #d6d3cd;
    border-radius:8px;
    padding:10px 12px;
    font: 12px/1.4 Arial, Helvetica, sans-serif;
    color:#444;
    max-width: 320px;
    z-index:10;
  }
  .hint b{ color:#111; }

  /* ===== Print ===== */
  @media print{
    html, body{ background:#fff; }
    .sheet{
      margin:0;
      box-shadow:none;
    }
    .toolbar, .hint{ display:none !important; }
    .sheet > .label{
      /* guía de corte fina al imprimir */
      border: 0.2mm dashed #888;
    }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="window.print()">Imprimir hoja</button>
</div>

<div class="hint">
  Hoja <b>A4</b> con <b>10 etiquetas</b> de <b>10 × 5 cm</b> (2 columnas × 5 filas).<br />
  Al imprimir, en el diálogo del navegador desmarcá <i>“Encabezados y pies de página”</i> y poné márgenes en <i>“Ninguno”</i> para que no aparezca la fecha ni la URL.
</div>

<div class="sheet" id="sheet"></div>

<!-- Plantilla de una etiqueta -->
<template id="label-tpl">
  <div class="label">
    <div class="label-inner">

      <div class="row top">
        <div class="logo-cell">
          <img src="logo.png" alt="Evolution Chemical S.R.L." />
        </div>
        <div class="top-fields">
          <div class="field">
            <span class="lbl">Empresa solicitante:</span>
            <span class="underline"></span>
          </div>
          <div class="field fecha">
            <span class="lbl">Fecha:</span>
            <span class="ul-fixed"></span><span class="slash">/</span><span class="ul-fixed"></span><span class="slash">/</span><span class="ul-fixed"></span>
          </div>
        </div>
      </div>

      <div class="row tipo-row">
        <div class="tipo">
          <span class="lead">Tipo de Muestra:</span>
          <span class="opt"><span class="box"></span>Sólido</span>
          <span class="opt"><span class="box"></span>Agua</span>
          <span class="opt"><span class="box"></span>Petróleo</span>
          <span class="opt"><span class="box"></span>Prod. Qco</span>
          <span class="opt"><span class="box"></span>Otro (especificar)</span>
        </div>
      </div>

      <div class="row bottom-row">
        <div class="bottom">
          <div class="field field-contact">
            <span class="lbl">Contacto:</span>
            <span class="underline"></span>
          </div>
          <div class="field-analisis">
            <span class="lbl">Análisis Requerido:</span>
            <span class="underline"></span>
          </div>
          <span class="line"></span>
          <span class="line"></span>
        </div>
      </div>

    </div>
  </div>
</template>

<script>
  // Genera 10 etiquetas (2 columnas × 5 filas) en la hoja A4
  (function(){
    const sheet = document.getElementById('sheet');
    const tpl = document.getElementById('label-tpl');
    for (let i = 0; i < 10; i++){
      sheet.appendChild(tpl.content.cloneNode(true));
    }
  })();
</script>

</body>
</html>
